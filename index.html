<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Friend Map">
<meta name="theme-color" content="#07090d">
<title>Friend Map</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090d;--panel:rgba(12,16,24,.82);--ink:#f2f5fa;--dim:#8b96a8;--neon:#00f0ff;--hot:#ff2bd6;--line:rgba(0,240,255,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 'Space Grotesk',system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;z-index:1;background:#0b0e14}
#map.drawing{cursor:crosshair;touch-action:none}
.leaflet-container{font-family:inherit}
.darktiles{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(1.15) saturate(.5)}
.radartiles{filter:grayscale(1) invert(1) contrast(1.3) sepia(1) hue-rotate(75deg) saturate(3.5) brightness(.95)}
#radar{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden;mix-blend-mode:screen}
#radar div{position:absolute;left:50%;top:50%;width:300vmax;height:300vmax;margin:-150vmax 0 0 -150vmax;border-radius:50%}
#sweep{background:conic-gradient(rgba(57,255,136,0) 0deg 290deg,rgba(57,255,136,.22) 350deg,rgba(57,255,136,.7) 360deg)}
#rings{background:repeating-radial-gradient(circle,transparent 0 109px,rgba(57,255,136,.22) 110px 111px)}
.pin .b.blip{animation:blip 1s ease-out}
@keyframes blip{0%{transform:scale(1.4);filter:brightness(2);box-shadow:0 0 0 3px rgba(0,0,0,.35),0 0 46px 14px var(--c)}100%{transform:scale(1)}}
.leaflet-control-attribution{background:rgba(7,9,13,.6)!important;color:#667!important;font-size:10px}
.leaflet-control-attribution a{color:#889!important}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.glass{background:var(--panel);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.top{position:fixed;z-index:10;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;gap:8px;align-items:center;pointer-events:none}
.pill{pointer-events:auto;border-radius:999px;padding:9px 15px;font-size:14px;display:flex;align-items:center;gap:8px;min-height:40px}
.dot{width:10px;height:10px;border-radius:50%;background:#888;flex:none}
.dot.ok{background:#39ff88;box-shadow:0 0 10px #39ff88}.dot.warn{background:#ffc020;box-shadow:0 0 10px #ffc020}.dot.bad{background:#ff3b5c;box-shadow:0 0 10px #ff3b5c}
.spacer{flex:1}
.side{position:fixed;z-index:10;right:12px;top:calc(env(safe-area-inset-top) + 64px);display:flex;flex-direction:column;gap:10px}
.fab{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fab.on{background:var(--hot);border-color:var(--hot);box-shadow:0 0 22px rgba(255,43,214,.6)}
.fab.ping{color:var(--neon)}
.sheet{position:fixed;z-index:10;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom) + 12px);pointer-events:none}
.drawbar{pointer-events:auto;display:none;flex-direction:column;gap:10px;border-radius:22px;padding:12px;margin-bottom:10px}
.drawbar.show{display:flex}
.row1{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.bc{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.bc.sel{border-color:#fff;box-shadow:0 0 12px currentColor}
.sz{width:40px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.06)}
.sz.sel{background:rgba(0,240,255,.2);outline:1px solid var(--neon)}
.sz i{display:block;border-radius:50%;background:#fff}
.tb{border-radius:999px;padding:9px 14px;font-size:14px;background:rgba(255,255,255,.07);min-height:40px}
.tb.go2{background:var(--hot);font-weight:700}
.friends{pointer-events:auto;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:12px 8px 2px 0}
.friends::-webkit-scrollbar{display:none}
.chipw{position:relative;flex:none;display:flex}
.chip{flex:none;border-radius:18px;padding:9px 14px 9px 9px;display:flex;gap:10px;align-items:center;min-height:56px;text-align:left}
.chip .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;border:2px solid}
.chip b{display:block;font-size:15px;font-weight:700;white-space:nowrap}
.chip small{display:block;color:var(--dim);font-size:12.5px;white-space:nowrap}
.chip.stale{opacity:.5}
.x{position:absolute;top:-9px;right:-7px;min-width:28px;height:28px;border-radius:14px;background:#1b2130;border:1px solid rgba(255,255,255,.15);font-size:12px;display:grid;place-items:center;padding:0 8px}
.x.arm{background:#ff3b5c;border-color:#ff3b5c;font-weight:700;box-shadow:0 0 14px rgba(255,59,92,.6)}
.pin{position:relative;width:0;height:0}
.pin .b{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#0d1118;border:3px solid var(--c);box-shadow:0 0 0 3px rgba(0,0,0,.35),0 0 18px var(--c),inset 0 0 12px rgba(255,255,255,.08)}
.pin.me .b::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--c);animation:halo 2.2s ease-out infinite}
.pin.stale .b{filter:grayscale(.9) brightness(.7)}
.pin .n{position:absolute;left:50%;top:26px;transform:translateX(-50%);background:rgba(7,9,13,.88);border:1px solid var(--c);color:#fff;font:700 12px 'Space Grotesk',sans-serif;padding:2px 9px;border-radius:9px;white-space:nowrap}
.pin .n em{font-style:normal;color:var(--dim);font-weight:400}
@keyframes halo{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.ripple{position:relative;width:0;height:0}
.ripple i{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:3px solid var(--c);box-shadow:0 0 20px var(--c);animation:rip 1.6s ease-out infinite;opacity:0}
.ripple i:nth-child(2){animation-delay:.5s}.ripple i:nth-child(3){animation-delay:1s}
@keyframes rip{0%{transform:scale(.1);opacity:1}100%{transform:scale(1.6);opacity:0}}
@media(prefers-reduced-motion:reduce){.pin.me .b::after,.ripple i,#join::before{animation:none}}
#toasts{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 60px);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{pointer-events:auto;border-radius:16px;padding:11px 16px;font-size:15px;animation:tin .25s ease-out;max-width:100%}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
#join{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 30%,#101a2a 0%,var(--bg) 70%);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
#join::before{content:'';position:fixed;left:50%;top:30%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:conic-gradient(from 0deg,rgba(0,240,255,.22),transparent 18%,transparent);animation:sweep 4s linear infinite;pointer-events:none}
#join::after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-radial-gradient(circle at 50% 30%,transparent 0 79px,rgba(0,240,255,.08) 80px 81px)}
@keyframes sweep{to{transform:rotate(360deg)}}
#join.hide{display:none}
.card{width:100%;max-width:420px;position:relative;z-index:1}
.card h1{font-size:48px;line-height:1;margin:0 0 8px;font-weight:700;letter-spacing:-.02em;text-shadow:0 0 24px rgba(0,240,255,.5)}
.card h1 span{color:var(--neon)}
.card p{color:var(--dim);margin:0 0 20px}
label{display:block;font-size:13px;color:var(--dim);margin:16px 0 7px}
input{width:100%;font:16px 'Space Grotesk',sans-serif;padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(12,16,24,.9);color:var(--ink);outline:none}
input:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(0,240,255,.15)}
.grid{display:flex;gap:8px;flex-wrap:wrap}
.em{width:44px;height:44px;border-radius:12px;font-size:24px;background:rgba(255,255,255,.05);border:2px solid transparent}
.em.sel{border-color:var(--neon);background:rgba(0,240,255,.12)}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.sw.sel{border-color:#fff;box-shadow:0 0 14px currentColor}
.go{width:100%;margin-top:24px;padding:16px;border-radius:16px;background:linear-gradient(90deg,var(--neon),var(--hot));color:#05070b;font-weight:700;font-size:18px;box-shadow:0 0 28px rgba(255,43,214,.35)}
.err{color:#ff6b86;font-size:14px;min-height:20px;margin-top:12px}
.menu{position:fixed;z-index:40;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.menu.show{display:flex}
.menu .card{background:#0d1118;border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);max-width:520px}
.menu button.row{width:100%;text-align:left;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.05);margin-top:8px;min-height:50px}
.menu button.danger{color:#ff6b86}
.code{font-weight:700;color:var(--neon)}
.fab{position:relative}
.badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:var(--hot);color:#fff;font-size:11px;font-weight:700;display:none;place-items:center;padding:0 5px;box-shadow:0 0 10px var(--hot)}
.badge.show{display:grid}
#chat{position:fixed;z-index:35;left:0;right:0;bottom:0;height:min(72vh,620px);display:none;flex-direction:column;border-radius:24px 24px 0 0;border-bottom:0;padding:14px 14px calc(env(safe-area-inset-bottom) + 12px);max-width:560px;margin:0 auto}
#chat.show{display:flex}
.chead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.chead b{flex:1;font-size:17px}
.lockbox{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center;padding:0 8px}
.lockbox .big{font-size:44px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.m{display:flex;gap:8px;align-items:flex-end;max-width:85%}
.m .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;border:2px solid;flex:none;background:#0d1118}
.m .bub{background:rgba(255,255,255,.07);border-radius:16px 16px 16px 4px;padding:8px 12px;overflow-wrap:anywhere}
.m .bub small{display:block;color:var(--dim);font-size:11.5px;margin-bottom:2px}
.m.mine{align-self:flex-end;flex-direction:row-reverse}
.m.mine .bub{background:linear-gradient(135deg,rgba(0,240,255,.25),rgba(255,43,214,.25));border-radius:16px 16px 4px 16px}
.cin{display:flex;gap:8px;margin-top:10px}
.cin input{flex:1}
.cin button,.lockbox button{border-radius:14px;padding:0 18px;min-height:50px;background:linear-gradient(90deg,var(--neon),var(--hot));color:#05070b;font-weight:700}
.empty{color:var(--dim);text-align:center;margin:auto;font-size:14px}
</style>
</head>
<body>
<div id="map"></div>
<div id="radar"><div id="rings"></div><div id="sweep"></div></div>
<div id="toasts"></div>

<div class="top">
  <div class="pill glass" id="status"><span class="dot" id="sdot"></span><span id="stext">Starting…</span></div>
  <div class="spacer"></div>
  <button class="pill glass" id="menuBtn">☰ Menu</button>
</div>

<div class="side">
  <button class="fab glass" id="meBtn" title="Center on me"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  <button class="fab glass" id="drawBtn" title="Draw"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg></button>
  <button class="fab glass ping" id="pingBtn" title="Ping my spot"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M7.5 7.5a6.4 6.4 0 0 0 0 9M16.5 7.5a6.4 6.4 0 0 1 0 9M4.6 4.6a10.5 10.5 0 0 0 0 14.8M19.4 4.6a10.5 10.5 0 0 1 0 14.8"/></svg></button>
  <button class="fab glass" id="chatBtn" title="Secure chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M12 9.5v2"/><circle cx="12" cy="8" r="0.6"/></svg><span class="badge" id="badge"></span></button>
  <button class="fab glass" id="allBtn" title="Show everyone"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M15 20c0-2.5 1-4.5 4-4.5"/></svg></button>
  <button class="fab glass" id="styleBtn" title="Map style"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
</div>

<div class="sheet">
  <div class="drawbar glass" id="drawbar">
    <div class="row1" id="brushColors"></div>
    <div class="row1">
      <button class="sz" data-s="4" aria-label="Thin"><i style="width:6px;height:6px"></i></button>
      <button class="sz" data-s="8" aria-label="Medium"><i style="width:11px;height:11px"></i></button>
      <button class="sz" data-s="14" aria-label="Thick"><i style="width:17px;height:17px"></i></button>
      <button class="tb" id="undoBtn">Undo</button>
      <button class="tb" id="clearMine">Clear mine</button>
      <button class="tb" id="clearAll">Clear all</button>
      <button class="tb go2" id="doneDraw">Done</button>
    </div>
  </div>
  <div class="friends" id="friends"></div>
</div>

<div id="chat" class="glass">
  <div class="chead"><b>🔒 Secure chat</b><button class="tb" id="lockBtn">Lock</button><button class="tb" id="closeChat">Close</button></div>
  <form class="lockbox" id="lockForm">
    <div class="big">🔐</div>
    <div>Enter the chat code to read and send messages. Everyone in the chat needs the same code — it’s separate from the group code.</div>
    <input id="chatCode" type="password" minlength="4" maxlength="64" autocomplete="off" placeholder="Chat code" aria-label="Chat code">
    <button type="submit">Unlock</button>
    <div class="err" id="lockErr"></div>
  </form>
  <div class="msgs" id="msgs" hidden></div>
  <form class="cin" id="cin" hidden><input id="ctext" maxlength="500" autocomplete="off" placeholder="Message…" aria-label="Message"><button type="submit">Send</button></form>
</div>

<div class="menu" id="menu">
  <div class="card">
    <div style="color:var(--dim);font-size:14px">Group: <span class="code" id="mCode"></span> · You: <span class="code" id="mName"></span></div>
    <button class="row" id="inviteBtn">🔗 Copy invite link</button>
    <button class="row" id="radarBtn">Radar sweep: on</button>
    <button class="row" id="installBtn" hidden>📲 Install app</button>
    <button class="row" id="wakeBtn">Keep screen on: off</button>
    <button class="row" id="editBtn">Change name / emoji / color</button>
    <button class="row danger" id="leaveBtn">Leave group &amp; stop sharing</button>
    <button class="row" id="closeMenu">Close</button>
  </div>
</div>

<div id="join">
  <form class="card" id="joinForm">
    <h1>Friend<span>Map</span></h1>
    <p>Live locations and a shared map you can draw on. Everyone uses the same secret group code.</p>
    <label for="jName">Your name</label>
    <input id="jName" maxlength="16" autocomplete="nickname" required>
    <label>Your avatar</label>
    <div class="grid" id="emojis"></div>
    <label>Your color</label>
    <div class="grid" id="swatches"></div>
    <label for="jCode">Secret group code (6+ characters, only share with friends)</label>
    <input id="jCode" minlength="6" maxlength="64" autocapitalize="off" autocomplete="off" required>
    <button class="go" type="submit">Join the map</button>
    <div class="err" id="jErr"></div>
  </form>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
{
const COLORS=['#00f0ff','#ff2bd6','#39ff88','#ffe600','#ff7a00','#ff3b5c','#9d6bff','#ffffff'];
const EMOJIS=['😎','👽','🐸','🦊','🐼','🤖','👻','💀','🦄','🔥','🐱','🍕'];
const BROKERS=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt','wss://test.mosquitto.org:8081'];
const STYLES={
  radar:{name:'Radar',url:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',o:{maxZoom:19,className:'radartiles',attribution:'© OpenStreetMap'}},
  dark:{name:'Neon dark',url:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',o:{maxZoom:19,className:'darktiles',attribution:'© OpenStreetMap'}},
  sat:{name:'Satellite',url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',o:{maxZoom:19,attribution:'Imagery © Esri'}},
  street:{name:'Street',url:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',o:{maxZoom:19,attribution:'© OpenStreetMap'}}
};
const STALE_MS=5*60e3, HIDE_MS=12*3600e3;
const $=id=>document.getElementById(id);
const enc=new TextEncoder(),dec=new TextDecoder();

let cfg={};try{cfg=JSON.parse(localStorage.getItem('friendmap')||'{}')}catch{}
if(!cfg.id)cfg.id=Math.random().toString(36).slice(2,10);
const save=()=>{try{localStorage.setItem('friendmap',JSON.stringify(cfg))}catch{}};
// invite link: #g=<code>
{const m=location.hash.match(/^#g=(.+)$/);if(m){const code=decodeURIComponent(m[1]);if(code.length>=6&&code!==cfg.code){cfg.code=code;cfg.joinedAt=Date.now()}save();try{history.replaceState(null,'',location.pathname)}catch{}}}

let key=null,root='',client=null,brokerIdx=0,connected=false,geoErr='',armed='',armT=0,lastPing=0;
let me=null,myAcc=null,mySpeed=0,lastPub={t:0,lat:0,lng:0},watchId=null,firstFix=true,wakeLock=null;
const people=new Map(), strokes=new Map();

// ---------- map ----------
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([30,0],2);
let tiles=null;
function setStyle(k){if(!STYLES[k])k='radar';cfg.style=k;save();if(tiles)map.removeLayer(tiles);tiles=L.tileLayer(STYLES[k].url,STYLES[k].o).addTo(map)}
setStyle(cfg.style||'radar');
$('styleBtn').onclick=()=>{const ks=Object.keys(STYLES);const k=ks[(ks.indexOf(cfg.style)+1)%ks.length];setStyle(k);toast('Map: '+STYLES[k].name)};

// ---------- toasts ----------
function toast(text,onTap){
  const t=document.createElement('div');t.className='toast glass';t.textContent=text;
  if(onTap){t.style.cursor='pointer';t.onclick=()=>{onTap();t.remove()}}
  $('toasts').appendChild(t);setTimeout(()=>t.remove(),3500);
}

// ---------- crypto ----------
async function setup(code){
  const base=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']);
  key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('friendmap-v1'),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  const h=new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode('fm-topic:'+code)));
  root='friendmap1/'+[...h.slice(0,12)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
const b64=u=>{let s='';u.forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function seal(obj,k=key){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj))));
  const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return b64(out);
}
async function unseal(str,k=key){
  try{const u=unb64(str);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},k,u.slice(12));return JSON.parse(dec.decode(pt))}catch{return null}
}

// ---------- status ----------
function status(){
  const d=$('sdot'),t=$('stext');
  if(geoErr){statusErr(geoErr);return}
  if(!connected){d.className='dot warn';t.textContent='Connecting…';return}
  if(!me){d.className='dot warn';t.textContent='Finding you…';return}
  const on=[...people.values()].filter(p=>Date.now()-p.data.t<STALE_MS).length;
  d.className='dot ok';t.textContent='Live · '+(on?on+' friend'+(on>1?'s':'')+' online':'sharing');
}
function statusErr(msg){$('sdot').className='dot bad';$('stext').textContent=msg}

// ---------- mqtt ----------
function connect(){
  if(client){try{client.end(true)}catch{}}
  const url=BROKERS[brokerIdx%BROKERS.length];
  connected=false;status();
  const c=mqtt.connect(url,{clientId:'fm_'+cfg.id+'_'+Math.random().toString(36).slice(2,6),clean:true,reconnectPeriod:4000,connectTimeout:8000,keepalive:30});
  client=c;let ok=false;
  const failover=setTimeout(()=>{if(!ok&&client===c){brokerIdx++;connect()}},10000);
  c.on('connect',()=>{ok=true;clearTimeout(failover);connected=true;seen=new Set();clearTimeout(recT);recT=setTimeout(reconcile,6000);c.subscribe(root+'/#',{qos:0});status();if(me)publishLoc(true)});
  c.on('close',()=>{connected=false;status()});
  c.on('message',(topic,payload)=>onMsg(topic,payload.toString()));
}
function pub(sub,str,retain=true){if(client&&connected)client.publish(root+'/'+sub,str,{qos:0,retain})}

async function onMsg(topic,str,fromCache=false){
  const [kind,id]=topic.slice(root.length+1).split('/');
  if(!fromCache)seen.add(kind+'/'+id);
  if(cache[kind]&&id){if(str)cache[kind][id]=str;else delete cache[kind][id];saveCacheSoon()}
  if(kind==='loc'){
    if(id===cfg.id)return;
    if(!str){removePerson(id);return}
    const d=await unseal(str);if(!d||typeof d.lat!=='number')return;
    upsertPerson(id,d);
  }else if(kind==='arrow'){
    if(!str){removeStroke(id);return}
    const d=await unseal(str);if(!d||!Array.isArray(d.pts))return;
    upsertStroke(id,d);
  }else if(kind==='ping'){
    if(!str)return;
    const d=await unseal(str);if(!d||typeof d.lat!=='number'||Date.now()-d.t>60e3)return;
    ripple(d.lat,d.lng,d.color);
    if(id!==cfg.id)toast(`${d.emoji||'📍'} ${d.name} pinged their spot`,()=>map.flyTo([d.lat,d.lng],Math.max(map.getZoom(),17)));
  }else if(kind==='chat'){
    if(!str){chatRaw.delete(id);chatMsgs.delete(id);renderChat();return}
    chatRaw.set(id,str);
    if(chatKey){const m=await unseal(str,chatKey);if(m&&typeof m.text==='string'){const fresh=!chatMsgs.has(id);chatMsgs.set(id,m);renderChat();if(fresh&&m.by!==cfg.id&&Date.now()-m.t<60e3)notifyChat(m)}}
    else if(Date.now()-parseInt(id.split('-')[1]||'0',36)<60e3&&!id.startsWith(cfg.id+'-'))notifyChat(null);
  }else if(kind==='kick'){
    if(id!==cfg.id||!str)return;
    const d=await unseal(str);if(!d||!(d.t>(cfg.joinedAt||0)))return;
    pub('kick/'+cfg.id,'');leave('Someone removed you from the map. Type the group code to rejoin.');
  }
}

// ---------- people ----------
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kmh=s=>s>1?Math.round(s*3.6)+' km/h':'';
function pinIcon(d,isMe,stale){
  const sp=kmh(d.s||0);
  return L.divIcon({className:'',iconSize:[0,0],html:`<div class="pin ${isMe?'me':''} ${stale?'stale':''}" style="--c:${esc(d.color)}"><div class="b">${esc(d.emoji||'😎')}</div><div class="n">${isMe?'You':esc(d.name)}${sp?` <em>${sp}</em>`:''}</div></div>`});
}
function glide(marker,lat,lng){
  const from=marker.getLatLng(),t0=performance.now(),dur=900;
  if(marker._raf)cancelAnimationFrame(marker._raf);
  if(map.distance(from,[lat,lng])>2000){marker.setLatLng([lat,lng]);return}
  const step=now=>{const k=Math.min(1,(now-t0)/dur),e=1-(1-k)**3;marker.setLatLng([from.lat+(lat-from.lat)*e,from.lng+(lng-from.lng)*e]);if(k<1)marker._raf=requestAnimationFrame(step)};
  marker._raf=requestAnimationFrame(step);
}
function upsertPerson(id,d){
  if(Date.now()-d.t>HIDE_MS){removePerson(id);return}
  let p=people.get(id);
  const stale=Date.now()-d.t>STALE_MS;
  if(!p){p={data:d,marker:L.marker([d.lat,d.lng],{icon:pinIcon(d,false,stale),zIndexOffset:500}).addTo(map)};people.set(id,p);
    p.marker.on('click',()=>map.flyTo([p.data.lat,p.data.lng],Math.max(map.getZoom(),17)));}
  else{const moved=p.data.lat!==d.lat||p.data.lng!==d.lng;p.data=d;if(moved)glide(p.marker,d.lat,d.lng);p.marker.setIcon(pinIcon(d,false,stale))}
  renderFriends();status();
}
function removePerson(id){const p=people.get(id);if(p){map.removeLayer(p.marker);people.delete(id);renderFriends();status()}}

function ago(t){const s=Math.max(0,(Date.now()-t)/1000);if(s<45)return'live';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return'over a day ago'}
function dist(a,b){if(!a||!b)return'';const m=map.distance([a.lat,a.lng],[b.lat,b.lng]);return m<1000?Math.round(m)+' m':(m/1000).toFixed(m<10000?1:0)+' km'}
function renderFriends(){
  const list=[...people.entries()].sort((a,b)=>b[1].data.t-a[1].data.t);
  const meChip=me?`<span class="chipw"><button class="chip glass" data-me="1"><span class="av" style="border-color:${esc(cfg.color)}">${esc(cfg.emoji||'😎')}</span><span><b>You</b><small>${[myAcc?'±'+Math.round(myAcc)+' m':'sharing',kmh(mySpeed)].filter(Boolean).join(' · ')}</small></span></button></span>`:'';
  $('friends').innerHTML=meChip+(list.length?list.map(([id,p])=>{
    const d=p.data,st=Date.now()-d.t>STALE_MS;
    const sub=[ago(d.t),me?dist(me,d):'',st?'':kmh(d.s||0)].filter(Boolean).join(' · ');
    return `<span class="chipw"><button class="chip glass ${st?'stale':''}" data-id="${esc(id)}"><span class="av" style="border-color:${esc(d.color)}">${esc(d.emoji||'😎')}</span><span><b>${esc(d.name)}</b><small>${sub}</small></span></button><button class="x ${armed===id?'arm':''}" data-x="${esc(id)}" aria-label="Remove from map">${armed===id?'Remove?':'✕'}</button></span>`}).join('')
    :`<div class="chip glass"><span><b>No friends here yet</b><small>Menu → Copy invite link</small></span></div>`);
}
$('friends').addEventListener('click',e=>{
  const x=e.target.closest('.x');
  if(x){const id=x.dataset.x;clearTimeout(armT);if(armed===id){armed='';kick(id)}else{armed=id;renderFriends();armT=setTimeout(()=>{armed='';renderFriends()},3000)}return}
  const c=e.target.closest('.chip');if(!c)return;
  if(c.dataset.me){centerMe();return}
  const p=people.get(c.dataset.id);if(p)map.flyTo([p.data.lat,p.data.lng],Math.max(map.getZoom(),17));
});
setInterval(()=>{for(const [id,p] of people)upsertPerson(id,p.data);if(me)publishLoc(false)},30000);

// ---------- my location ----------
let meMarker=null,meCircle=null;
const myData=()=>({name:cfg.name,color:cfg.color,emoji:cfg.emoji,s:mySpeed});
function startGeo(){
  if(!('geolocation' in navigator)){geoErr='This browser has no location';status();return}
  watchId=navigator.geolocation.watchPosition(pos=>{
    geoErr='';me={lat:pos.coords.latitude,lng:pos.coords.longitude};myAcc=pos.coords.accuracy;mySpeed=pos.coords.speed||0;
    if(!meMarker){meMarker=L.marker([me.lat,me.lng],{icon:pinIcon(myData(),true,false),zIndexOffset:1000}).addTo(map);
      meCircle=L.circle([me.lat,me.lng],{radius:myAcc,color:cfg.color,weight:1,fillOpacity:.08,interactive:false}).addTo(map)}
    else{glide(meMarker,me.lat,me.lng);meMarker.setIcon(pinIcon(myData(),true,false));meCircle.setLatLng([me.lat,me.lng]).setRadius(myAcc)}
    if(firstFix){firstFix=false;map.setView([me.lat,me.lng],17)}
    publishLoc(false);status();renderFriends();
  },err=>{
    geoErr=err.code===1?'Location blocked – allow it in settings':'Can’t get location';status();
  },{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
async function publishLoc(force){
  if(!me||!connected)return;
  const now=Date.now();
  const moved=map.distance([me.lat,me.lng],[lastPub.lat,lastPub.lng]);
  if(!force&&moved<6&&now-lastPub.t<25000)return;
  lastPub={t:now,...me};
  pub('loc/'+cfg.id,await seal({...myData(),lat:+me.lat.toFixed(6),lng:+me.lng.toFixed(6),acc:Math.round(myAcc||0),s:Math.round(mySpeed*10)/10,t:now}));
}
function centerMe(){if(me)map.flyTo([me.lat,me.lng],Math.max(map.getZoom(),17));else toast(geoErr||'Still finding you…')}
$('meBtn').onclick=centerMe;
$('allBtn').onclick=()=>{
  const pts=[...people.values()].map(p=>[p.data.lat,p.data.lng]);if(me)pts.push([me.lat,me.lng]);
  if(pts.length===1)map.flyTo(pts[0],17);else if(pts.length)map.flyToBounds(pts,{padding:[70,70],maxZoom:17});else toast('Nobody on the map yet');
};

// ---------- freehand drawing ----------
function upsertStroke(id,d){
  removeStroke(id);
  if(d.pts.length<2)return;
  const w=d.w||8;
  const g=L.layerGroup([
    L.polyline(d.pts,{color:d.color,weight:w*2.8,opacity:.22,lineCap:'round',lineJoin:'round',interactive:false}),
    L.polyline(d.pts,{color:d.color,weight:w,opacity:1,lineCap:'round',lineJoin:'round',interactive:false})
  ]).addTo(map);
  strokes.set(id,{data:d,g});
}
function removeStroke(id){const s=strokes.get(id);if(s){map.removeLayer(s.g);strokes.delete(id)}}
const myStrokeIds=()=>[...strokes.entries()].filter(([,s])=>s.data.by===cfg.id).sort((a,b)=>a[1].data.t-b[1].data.t).map(([id])=>id);
function clearStroke(id){pub('arrow/'+id,'');removeStroke(id)}

let drawMode=false,drawing=null,temp=null;
function renderBrush(){
  if(!cfg.brush)cfg.brush=cfg.color;if(!cfg.size)cfg.size=8;
  $('brushColors').innerHTML=COLORS.map(c=>`<button class="bc ${c===cfg.brush?'sel':''}" data-c="${c}" style="background:${c};color:${c}" aria-label="brush color"></button>`).join('');
  document.querySelectorAll('.sz').forEach(b=>b.classList.toggle('sel',+b.dataset.s===cfg.size));
}
$('brushColors').addEventListener('click',e=>{const b=e.target.closest('.bc');if(b){cfg.brush=b.dataset.c;save();renderBrush()}});
document.querySelectorAll('.sz').forEach(b=>b.onclick=()=>{cfg.size=+b.dataset.s;save();renderBrush()});
function setDraw(on){
  drawMode=on;$('drawBtn').classList.toggle('on',on);$('drawbar').classList.toggle('show',on);$('map').classList.toggle('drawing',on);
  if(on)renderBrush();
  const h=on?'disable':'enable';map.dragging[h]();map.touchZoom[h]();map.doubleClickZoom[h]();map.scrollWheelZoom[h]();map.boxZoom[h]();
}
$('drawBtn').onclick=()=>setDraw(!drawMode);
$('doneDraw').onclick=()=>setDraw(false);
$('undoBtn').onclick=()=>{const ids=myStrokeIds();if(ids.length)clearStroke(ids[ids.length-1])};
$('clearMine').onclick=()=>myStrokeIds().forEach(clearStroke);
let clearArmed=0;
$('clearAll').onclick=e=>{
  if(Date.now()-clearArmed<3000){[...strokes.keys()].forEach(clearStroke);e.target.textContent='Clear all';clearArmed=0;toast('Map wiped clean')}
  else{clearArmed=Date.now();e.target.textContent='Tap again';setTimeout(()=>e.target.textContent='Clear all',3000)}
};
const mapEl=$('map');
mapEl.addEventListener('pointerdown',e=>{
  if(!drawMode||e.target.closest('.leaflet-control'))return;
  e.preventDefault();mapEl.setPointerCapture(e.pointerId);
  const ll=map.mouseEventToLatLng(e);drawing={pts:[ll],px:[map.mouseEventToContainerPoint(e)]};
  temp=L.polyline([ll],{color:cfg.brush,weight:cfg.size,opacity:.85,lineCap:'round',lineJoin:'round',interactive:false}).addTo(map);
});
mapEl.addEventListener('pointermove',e=>{
  if(!drawing)return;
  const cp=map.mouseEventToContainerPoint(e);
  if(cp.distanceTo(drawing.px[drawing.px.length-1])<3)return;
  drawing.px.push(cp);drawing.pts.push(map.containerPointToLatLng(cp));temp.setLatLngs(drawing.pts);
});
async function endDraw(){
  if(!drawing)return;
  const d=drawing;drawing=null;map.removeLayer(temp);temp=null;
  if(d.pts.length<2){const p=d.pts[0];d.pts.push(L.latLng(p.lat+1e-7,p.lng+1e-7))}
  let pts=d.pts;if(pts.length>400){const step=pts.length/400;pts=Array.from({length:400},(_,i)=>pts[Math.floor(i*step)]);pts.push(d.pts[d.pts.length-1])}
  const id=cfg.id+'-'+Date.now().toString(36);
  const data={by:cfg.id,color:cfg.brush,w:cfg.size,t:Date.now(),pts:pts.map(p=>[+p.lat.toFixed(7),+p.lng.toFixed(7)])};
  upsertStroke(id,data);
  if(connected)pub('arrow/'+id,await seal(data));else toast('Offline – drawing not shared');
}
mapEl.addEventListener('pointerup',endDraw);mapEl.addEventListener('pointercancel',endDraw);

// ---------- secure chat ----------
const chatRaw=new Map(),chatMsgs=new Map();let chatKey=null,unread=0;
async function deriveChatKey(code){
  const base=await crypto.subtle.importKey('raw',enc.encode(cfg.code+'|chat|'+code),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('friendmap-chat-v1'),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const chatOpen=()=>$('chat').classList.contains('show');
function setBadge(){$('badge').textContent=unread>9?'9+':unread;$('badge').classList.toggle('show',unread>0)}
function notifyChat(m){
  if(chatOpen()&&chatKey)return;
  unread++;setBadge();
  toast(m?`💬 ${m.emoji||''} ${m.name}: ${m.text.slice(0,60)}`:'💬 New locked message',openChat);
}
function showLocked(locked){$('lockForm').hidden=!locked;$('msgs').hidden=locked;$('cin').hidden=locked;$('lockBtn').hidden=locked}
function openChat(){$('chat').classList.add('show');showLocked(!chatKey);if(chatKey){unread=0;setBadge();renderChat();setTimeout(()=>$('ctext').focus(),50)}else setTimeout(()=>$('chatCode').focus(),50)}
$('chatBtn').onclick=()=>chatOpen()?$('chat').classList.remove('show'):openChat();
$('closeChat').onclick=()=>$('chat').classList.remove('show');
$('lockBtn').onclick=()=>{chatKey=null;chatMsgs.clear();$('chatCode').value='';showLocked(true)};
$('lockForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const code=$('chatCode').value;
  if(code.length<4){$('lockErr').textContent='Chat code needs 4+ characters';return}
  const k=await deriveChatKey(code);
  const got=new Map();
  for(const [id,str] of chatRaw){const m=await unseal(str,k);if(m&&typeof m.text==='string')got.set(id,m)}
  if(chatRaw.size&&!got.size){$('lockErr').textContent='Wrong code – messages stay locked';return}
  $('lockErr').textContent='';chatKey=k;chatMsgs.clear();got.forEach((m,id)=>chatMsgs.set(id,m));
  unread=0;setBadge();showLocked(false);renderChat();$('ctext').focus();
});
function renderChat(){
  if(!chatKey)return;
  const list=[...chatMsgs.values()].filter(m=>Date.now()-m.t<24*3600e3).sort((a,b)=>a.t-b.t).slice(-150);
  const box=$('msgs'),atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  box.innerHTML=list.length?list.map(m=>{
    const time=new Date(m.t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
    return `<div class="m ${m.by===cfg.id?'mine':''}"><span class="av" style="border-color:${esc(m.color)}">${esc(m.emoji||'😎')}</span><div class="bub"><small>${m.by===cfg.id?'You':esc(m.name)} · ${time}</small>${esc(m.text)}</div></div>`}).join('')
    :'<div class="empty">No messages yet. Only people with the chat code can read this.</div>';
  if(atBottom)box.scrollTop=box.scrollHeight;
}
$('cin').addEventListener('submit',async e=>{
  e.preventDefault();
  const text=$('ctext').value.trim();if(!text||!chatKey)return;
  if(!connected){toast('Offline – message not sent');return}
  const id=cfg.id+'-'+Date.now().toString(36);
  const m={by:cfg.id,name:cfg.name,emoji:cfg.emoji,color:cfg.color,text,t:Date.now()};
  $('ctext').value='';chatMsgs.set(id,m);renderChat();$('msgs').scrollTop=1e9;
  const str=await seal(m,chatKey);chatRaw.set(id,str);pub('chat/'+id,str);
});

// ---------- saved on this phone ----------
let cache={loc:{},arrow:{},chat:{}},cacheT=0,seen=new Set(),recT=0;
const cacheKey=()=>'fmcache:'+root;
function loadCache(){cache={loc:{},arrow:{},chat:{}};try{const c=JSON.parse(localStorage.getItem(cacheKey())||'null');if(c&&c.loc&&c.arrow&&c.chat)cache=c}catch{}}
function saveCacheSoon(){clearTimeout(cacheT);cacheT=setTimeout(()=>{
  const now=Date.now();
  for(const [k,days] of [['arrow',30],['chat',1]])for(const id in cache[k]){const ts=parseInt(id.split('-')[1]||'0',36);if(ts&&now-ts>days*864e5)delete cache[k][id]}
  try{localStorage.setItem(cacheKey(),JSON.stringify(cache))}catch{}
},800)}
function reconcile(){
  if(!connected)return;
  for(const k of ['arrow','loc','chat'])for(const id of Object.keys(cache[k]))if(!seen.has(k+'/'+id)){
    delete cache[k][id];
    if(k==='arrow')removeStroke(id);else if(k==='loc')removePerson(id);else{chatRaw.delete(id);chatMsgs.delete(id)}
  }
  renderChat();saveCacheSoon();
}

// ---------- radar ----------
let radarA=0,radarT=performance.now();
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function radarFrame(now){
  const on=cfg.radar!==false;
  $('radar').hidden=!on;
  if(on){
    const c=me?map.latLngToContainerPoint([me.lat,me.lng]):map.getSize().divideBy(2);
    for(const el of $('radar').children){el.style.left=c.x+'px';el.style.top=c.y+'px'}
    const prev=radarA;if(!reduceMotion)radarA=(radarA+Math.min(100,now-radarT)*0.09)%360;
    $('sweep').style.transform=`rotate(${radarA}deg)`;
    if(!reduceMotion)for(const p of people.values()){
      const q=map.latLngToContainerPoint([p.data.lat,p.data.lng]);
      const ang=(Math.atan2(q.x-c.x,c.y-q.y)*180/Math.PI+360)%360;
      const hit=prev<=radarA?(ang>prev&&ang<=radarA):(ang>prev||ang<=radarA);
      if(hit){const b=p.marker.getElement()?.querySelector('.b');if(b){b.classList.remove('blip');void b.offsetWidth;b.classList.add('blip')}}
    }
  }
  radarT=now;requestAnimationFrame(radarFrame);
}
requestAnimationFrame(radarFrame);
const radarLabel=()=>$('radarBtn').textContent='Radar sweep: '+(cfg.radar!==false?'on':'off');

function leave(msg){
  pub('loc/'+cfg.id,'');
  if(watchId!=null)navigator.geolocation.clearWatch(watchId);
  setTimeout(()=>{try{client&&client.end(true)}catch{};delete cfg.code;if(msg)cfg.msg=msg;save();location.reload()},600);
}
$('leaveBtn').onclick=()=>leave();
async function kick(id){
  if(!connected){toast('Offline – can’t remove right now');return}
  const name=people.get(id)?.data.name||'them';
  pub('loc/'+id,'');
  pub('kick/'+id,await seal({by:cfg.id,t:Date.now()}));
  removePerson(id);toast('Removed '+name+' from the map');
}

// ---------- join ----------
function showJoin(){
  $('join').classList.remove('hide');
  if(cfg.msg){$('jErr').textContent=cfg.msg;delete cfg.msg;save()}
  $('jName').value=cfg.name||'';$('jCode').value=cfg.code||'';
  if(!cfg.color)cfg.color=COLORS[Math.floor(Math.random()*COLORS.length)];
  if(!cfg.emoji)cfg.emoji=EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
  renderPickers();
}
function renderPickers(){
  $('emojis').innerHTML=EMOJIS.map(x=>`<button type="button" class="em ${x===cfg.emoji?'sel':''}" data-e="${x}">${x}</button>`).join('');
  $('swatches').innerHTML=COLORS.map(c=>`<button type="button" class="sw ${c===cfg.color?'sel':''}" data-c="${c}" style="background:${c};color:${c}" aria-label="color"></button>`).join('');
}
$('emojis').addEventListener('click',e=>{const b=e.target.closest('.em');if(b){cfg.emoji=b.dataset.e;renderPickers()}});
$('swatches').addEventListener('click',e=>{const b=e.target.closest('.sw');if(b){cfg.color=b.dataset.c;cfg.brush=b.dataset.c;renderPickers()}});
$('joinForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const name=$('jName').value.trim(),code=$('jCode').value.trim();
  if(!name){$('jErr').textContent='Type your name';return}
  if(code.length<6){$('jErr').textContent='Group code needs 6+ characters';return}
  if(!window.isSecureContext||!crypto.subtle){$('jErr').textContent='Open this page from an https:// link';return}
  const codeChanged=code!==cfg.code||!key;
  if(code!==cfg.code)cfg.joinedAt=Date.now();
  cfg.name=name;cfg.code=code;save();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
  $('join').classList.add('hide');
  if(!isStandalone()&&location.protocol!=='file:')setTimeout(()=>toast('📲 Tip: Menu → Install app puts it on your home screen'),3000);
  if(codeChanged)await start();
  else{refreshMe();publishLoc(true);renderFriends()}
});
function refreshMe(){if(meMarker){meMarker.setIcon(pinIcon(myData(),true,false));meCircle.setStyle({color:cfg.color})}}

async function start(){
  for(const id of [...people.keys()])removePerson(id);
  for(const id of [...strokes.keys()])removeStroke(id);
  chatRaw.clear();chatMsgs.clear();chatKey=null;unread=0;setBadge();
  if(!cfg.joinedAt){cfg.joinedAt=Date.now();save()}
  await setup(cfg.code);
  loadCache();for(const k of ['arrow','loc','chat'])for(const [id,str] of Object.entries(cache[k]))await onMsg(root+'/'+k+'/'+id,str,true);
  if(typeof mqtt==='undefined'){statusErr('Could not load – check internet');return}
  connect();
  if(watchId==null)startGeo();
  refreshMe();renderFriends();
  if(cfg.wake)setWake(true);
}

if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(cfg.code&&cfg.name){if(!cfg.emoji)cfg.emoji=EMOJIS[0];$('join').classList.add('hide');start()}else showJoin();
}
</script>
